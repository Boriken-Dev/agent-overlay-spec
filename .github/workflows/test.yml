name: Test

on:
  push:
    tags: ['ci-*']
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to validate
        required: true
        default: main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest
      - run: python -m json.tool schemas/overlay.schema.json > /dev/null
