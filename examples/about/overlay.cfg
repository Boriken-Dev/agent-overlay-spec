# Every informational field. A consumer that shows no store never reads [about], and nothing in
# it changes what the overlay does.
name = "release-notes"
description = """
Conventions for release notes and changelogs: what a release entry holds, how a breaking change is
announced, and which changes are left out.
"""
routing = ["- Writing release notes or a changelog → `$RELEASE_NOTES_OVERLAY_ROOT/kb/release-notes.md`"]

[about]
summary = "Release notes and changelogs, written the same way in every repository."
icon = "icon.webp"
homepage = "https://example.org/overlays/release-notes"
repository = "https://github.com/example/overlays"
license = "MIT OR Apache-2.0"
authors = ["Example Docs Team <docs@example.org>"]
tags = ["documentation", "release", "changelog"]
