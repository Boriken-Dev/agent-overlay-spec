name = "docs-tools"
description = "Environment as data: literals, paths under the root, secret references, env files and path additions."
routing = ["- Documentation tooling → `$DOCS_TOOLS_OVERLAY_ROOT/README.md`"]

env_files = [
  "env/defaults.cfg",
  { path = "env/windows.cfg", os = ["windows"] },
  { path = "env/banner.env", format = "dotenv" },
]

[env]
TOOL_CONFIG = { path = "conf/tool.toml" }
SYSHTTP_PREFIX = { value = "AGENTS_", if_unset = true }
DOCS_TOKEN = { provider = "env", key = "DOCS_TOKEN", optional = true }
RELEASE_KEY = { secret = "docs-release-key", optional = true }

[[paths]]
variable = "PATH"
path = "bin"

[[paths]]
variable = "PYTHONPATH"
path = "lib"
position = "append"
