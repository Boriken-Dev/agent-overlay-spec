name = "optional-setup"
description = "A setup step per OS, bounded by a timeout, with a declared network need."

[[setup]]
os = ["windows"]
interpreter = "powershell"
path = "setup/setup.ps1"
timeout = 30

[[setup]]
os = ["unix"]
interpreter = "sh"
path = "setup/setup.sh"
args = ["--quiet"]
timeout = 30
network = false
