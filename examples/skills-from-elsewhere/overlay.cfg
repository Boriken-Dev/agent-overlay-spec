# Like requirements.txt: this overlay says which skills it needs without carrying copies.
name = "docs-with-skills"
description = "Documentation work, with the skills it needs named from elsewhere."
skills = [
  # Bundled: skills/summarize-docs/SKILL.md is in this overlay, and in its tree digest.
  "summarize-docs",
  # No such directory: the consumer's catalogs resolve it, as pip's index resolves a name.
  "pdf",
  # A source of its own, checked against this pin when it is fetched.
  { name = "review", source = "https://github.com/example/skills.git#skills/review", pin = "sha256:8280aaf5de7c4f61342f648586d534e481ae095cef223dded70f5b1db5bd84a1" },
]
