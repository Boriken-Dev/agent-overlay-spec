name = "review-conventions"
description = "Context and a skill that name their own files and read their own settings."

[options.depth]
type = "string"
default = "normal"
description = "How thorough a review is: quick, normal or deep."

[options.max_findings]
type = "integer"
default = 10

[options.strict]
type = "boolean"
default = false

[options.service_token]
type = "string"
sensitive = true
description = "A credential for the review service. Never put in context; the tools read it from their environment."
