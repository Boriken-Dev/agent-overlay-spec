#!json
{
  "name": "complete-example",
  "description": "Every field the edition defines.",
  "requires": [
    "engineering"
  ],
  "routing": [
    "- Use the complete example → `$COMPLETE_EXAMPLE_OVERLAY_ROOT/README.md`"
  ],
  "rules": [
    "rules/always.md"
  ],
  "priority": 500,
  "defaults": { "setup": false, "rules": true, "deps": true },
  "context": [
    "CONTEXT.md"
  ],
  "skills": [
    "search",
    {
      "name": "review",
      "source": "https://github.com/example/skills.git#skills/review",
      "pin": "sha256:abababababababababababababababababababababababababababababababab"
    }
  ],
  "env_files": [
    "env/defaults.cfg",
    {
      "path": "env/local.env",
      "format": "dotenv",
      "os": [
        "unix"
      ]
    }
  ],
  "organization_extension": {
    "mode": "custom",
    "level": 2
  },
  "env": {
    "MODE": "read-only",
    "TOOL_CONFIG": {
      "path": "conf/tool.toml"
    },
    "PREFIX": {
      "value": "AGENTS_",
      "if_unset": true
    },
    "TOKEN": {
      "provider": "env",
      "key": "DOCS_TOKEN",
      "optional": true
    },
    "VAULTED": {
      "provider": "vault",
      "key": "team/docs",
      "version": 3,
      "mount": "kv"
    },
    "NAMED": {
      "secret": "docs-release-key"
    }
  },
  "paths": [
    {
      "variable": "PATH",
      "path": "bin"
    },
    {
      "variable": "PYTHONPATH",
      "path": "lib",
      "position": "append",
      "os": [
        "linux",
        "macos"
      ]
    }
  ],
  "env_scripts": [
    {
      "interpreter": "python",
      "path": "env/compute.py",
      "args": [
        "--quiet"
      ],
      "timeout": 10,
      "os": [
        "unix"
      ]
    }
  ],
  "runtime": {
    "os": [
      "linux",
      "macos",
      "windows"
    ],
    "commands": [
      "git",
      {
        "name": "gh",
        "os": [
          "linux"
        ]
      }
    ],
    "python": [
      {
        "os": [
          "windows"
        ],
        "version": "3.11",
        "lock": "locks/windows.txt",
        "lock_digest": "sha256:410b5c3586c4d4030654522b71929993674a6fbce9b271239f68bb0b4a618f27"
      },
      {
        "version": "3.9",
        "requirements": "requirements.txt",
        "environment": "isolated"
      }
    ],
    "node": [
      {
        "version": "20",
        "package": "web/package.json",
        "environment": "web-tools"
      }
    ]
  },
  "setup": [
    {
      "os": [
        "windows"
      ],
      "interpreter": "powershell",
      "path": "setup/setup.ps1",
      "timeout": 0
    },
    {
      "interpreter": "sh",
      "path": "setup/setup.sh",
      "args": [],
      "timeout": 120,
      "network": true
    }
  ],
  "scripts": {
    "run-check": "bin/check.py",
    "lint": {
      "path": "tools/lint.sh",
      "interpreter": "sh",
      "os": [
        "unix"
      ]
    },
    "skip-check": false
  },
  "harness": {
    "claude-code": {
      "context": [
        "kb/claude.md"
      ],
      "skills": true,
      "model": "example-model",
      "effort": "high",
      "own_setting": {
        "theme": "dark"
      }
    }
  },
  "mcp": {
    "servers": [
      {
        "name": "local",
        "transport": "stdio",
        "command": "node",
        "args": [
          "server.js"
        ],
        "env": {
          "MODE": "read-only",
          "TOKEN": {
            "provider": "env",
            "key": "DOCS_TOKEN"
          }
        },
        "env_passthrough": [
          "DOCS_HOME"
        ],
        "timeout": 60
      },
      {
        "name": "remote",
        "transport": "streamable-http",
        "url": "https://mcp.example.org/agent",
        "headers_env": {
          "Authorization": "DOCS_AUTHORIZATION"
        },
        "timeout": 2.5
      }
    ],
    "skills": [
      {
        "name": "search",
        "server": "local"
      }
    ]
  },
  "about": {
    "summary": "Every field the edition defines, in one manifest.",
    "icon": "icon.png",
    "homepage": "https://example.org/complete",
    "repository": "https://github.com/example/complete",
    "license": "Apache-2.0 WITH LLVM-exception",
    "authors": ["Example Team <team@example.org>"],
    "tags": ["example", "reference"]
  }
}
