name = "complete-example"
description = "Every supported top-level manifest field."
requires = ["engineering"]
routing = ["- Use the complete example → `$COMPLETE_EXAMPLE_OVERLAY_ROOT/README.md`"]
rules = ["rules/always.md"]
priority = 500
setup_timeout = 0

[scripts]
run-check = "bin/check.py"
skip-check = false

[mcp]

[[mcp.servers]]
name = "local"
transport = "stdio"
command = "node"
args = ["server.js"]
env = { MODE = "read-only" }
env_passthrough = ["DOCS_TOKEN"]
timeout = 60

[[mcp.servers]]
name = "remote"
transport = "streamable-http"
url = "https://mcp.example.org/agent"
headers_env = { Authorization = "DOCS_AUTHORIZATION" }

[[mcp.skills]]
name = "search"
server = "local"
